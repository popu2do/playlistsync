name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Extract Tag & Metadata
        id: meta
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          TIME: ${{ steps.meta.outputs.time }}
        run: |
          PKG_NAME="playlistsync-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "dist/${PKG_NAME}"
          
          LDFLAGS="-s -w -X 'playlistsync/internal/config.Version=${TAG}' -X 'playlistsync/internal/config.GitCommit=${COMMIT}' -X 'playlistsync/internal/config.BuildTime=${TIME}'"
          
          go build -trimpath -ldflags="${LDFLAGS}" -o "dist/${PKG_NAME}/playlistsync${{ matrix.ext }}" ./cmd/playlistsync
          
          cp README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "${PKG_NAME}.zip" "${PKG_NAME}"
            echo "ASSET_PATH=dist/${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            echo "ASSET_PATH=dist/${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlistsync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET_PATH }}

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built assets
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          draft: false
          prerelease: false
          generate_release_notes: true